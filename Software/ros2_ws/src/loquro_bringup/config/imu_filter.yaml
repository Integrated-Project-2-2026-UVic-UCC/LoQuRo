imu_filter:
  ros__parameters:
    use_mag: true
    mag_timeout: 0.5          # LoQuRo: seconds without /imu/mag before using only accel + gyro
    world_frame: enu
    publish_tf: false         # the robot TF comes from robot_state_publisher
    gain: 0.1
    zeta: 0.0
    orientation_stddev: 0.0
