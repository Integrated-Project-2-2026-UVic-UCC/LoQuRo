# Greeting: raises the front legs and waves with the left front one, then back down.
# Joint order of every leg: [haa, hfe, kfe] in rad. The right legs are mirrored.

speed: 0.67   # rad/s
loop: true

leg_poses:
  left_down:  [0.7, 1.5608, 0.8196]
  left_up:    [0.7, 0.3502, 1.4249]
  right_down: [0.7, 0.0392, 0.7804]
  right_up:   [0.7, 1.2498, 0.1751]
  knee_contracted: [0.7, 0.0, 0.0]
  wave_low:   [0.5, 0.0, 0.0]
  wave_high:  [0.9, 0.0, 0.0]

poses:
  down:        {lf: left_down,       rf: right_down, lh: left_down, rh: right_down}
  front_up:    {lf: left_up,         rf: right_up,   lh: left_down, rh: right_down}
  contracted:  {lf: knee_contracted, rf: right_up,   lh: left_down, rh: right_down}
  wave_low:    {lf: wave_low,        rf: right_up,   lh: left_down, rh: right_down}
  wave_high:   {lf: wave_high,       rf: right_up,   lh: left_down, rh: right_down}

sequence:
  - pose: down
  - pose: front_up
  - {pose: contracted, speed: 1.67}
  - {pose: wave_low,   speed: 1.67}
  - {pose: wave_high,  speed: 1.67}
  - {pose: wave_low,   speed: 1.67}
  - {pose: wave_high,  speed: 1.67}
  - {pose: front_up,   speed: 1.67}
  - pose: down
