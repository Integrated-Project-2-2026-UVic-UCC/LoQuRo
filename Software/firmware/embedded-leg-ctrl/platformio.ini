[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB

board_build.arduino.memory_type = qio_opi

lib_deps =
    https://github.com/eclipse-zenoh/zenoh-pico#1.9.0
    https://github.com/eProsima/Micro-CDR#v2.0.2
    https://github.com/tzapu/WiFiManager.git#4131fe617d01d746677e8b909379597162c2ca58
    https://github.com/adafruit/Adafruit-PWM-Servo-Driver-Library#3.0.3

build_flags =
    -I include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
monitor_rts = 0
monitor_dtr = 0

; Tests (icono de Test / pio test). Usan el codigo real de src/
test_build_src = yes
; el icono ejecuta los chequeos sin movimiento. Para mover las piernas: pio test -f test_legs
test_filter =
    test_imu
    test_network
